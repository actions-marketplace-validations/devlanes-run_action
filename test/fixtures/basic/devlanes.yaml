# An API behind a hostname and a worker without a port, like most projects.
project: fixture
services:
  api:
    # Services run from the repository root, not from this folder.
    run: [node, test/fixtures/server.mjs]
    hosts: "api.${{ lane.domain }}"
    ready:
      http:
        path: /healthz
  worker:
    run: [node, test/fixtures/worker.mjs]
    ready:
      log: worker ready
